<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callyzer — Live Call Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a12;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #12121e 0%, #151528 50%, #0d1b2a 100%);
            padding: 20px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #4CAF50, #00e676);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
        }

        .header .connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #F44336;
            transition: background 0.3s ease;
        }

        .header .connection-status .dot.connected {
            background: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        /* Section Title */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: linear-gradient(145deg, #13131f 0%, #171728 100%);
            border-radius: 16px;
            padding: 20px 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 16px 16px 0 0;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .stat-card .stat-label {
            font-size: 11px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-card .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }

        .stat-card .stat-sub {
            font-size: 12px;
            color: #555;
            margin-top: 6px;
            font-weight: 500;
        }

        .stat-card .stat-icon {
            position: absolute;
            top: 16px;
            right: 18px;
            font-size: 24px;
            opacity: 0.5;
        }

        .stat-card.total::before { background: linear-gradient(90deg, #667eea, #764ba2); }
        .stat-card.total .stat-value { color: #c5cae9; }

        .stat-card.incoming::before { background: linear-gradient(90deg, #4CAF50, #00e676); }
        .stat-card.incoming .stat-value { color: #69f0ae; }

        .stat-card.outgoing::before { background: linear-gradient(90deg, #2196F3, #00b0ff); }
        .stat-card.outgoing .stat-value { color: #82b1ff; }

        .stat-card.missed::before { background: linear-gradient(90deg, #F44336, #ff5252); }
        .stat-card.missed .stat-value { color: #ff8a80; }

        .stat-card.talktime::before { background: linear-gradient(90deg, #FF9800, #ffc107); }
        .stat-card.talktime .stat-value { color: #ffe082; font-size: 26px; }

        /* Today Stats Row */
        .today-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .today-card {
            background: #111120;
            border-radius: 12px;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .today-card .today-label {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .today-card .today-value {
            font-size: 22px;
            font-weight: 700;
            color: #aaa;
        }

        .today-card.today-talktime .today-value {
            color: #ffb74d;
            font-size: 18px;
        }

        /* Table Section */
        .table-section {
            background: linear-gradient(145deg, #13131f 0%, #131322 100%);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .table-header {
            padding: 18px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-header h2 {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }

        .table-header .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.08);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(76, 175, 80, 0.2);
            letter-spacing: 1px;
        }

        .table-header .live-badge .pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(76, 175, 80, 0); }
            100% { opacity: 1; box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 13px 18px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.015);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.025);
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.025);
        }

        tbody tr.new-row {
            animation: fadeIn 0.6s ease;
            background: rgba(76, 175, 80, 0.06);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        tbody td {
            padding: 13px 18px;
            font-size: 13.5px;
            color: #bbb;
        }

        .phone-number {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #9aa5ce;
        }

        .device-id {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 11px;
            color: #555;
        }

        .contact-name {
            color: #e0e0e0;
            font-weight: 600;
        }

        .duration-cell {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #90caf9;
            font-weight: 500;
        }

        .duration-zero {
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .badge-incoming {
            background: rgba(76, 175, 80, 0.12);
            color: #69f0ae;
            border: 1px solid rgba(76, 175, 80, 0.25);
        }

        .badge-outgoing {
            background: rgba(33, 150, 243, 0.12);
            color: #82b1ff;
            border: 1px solid rgba(33, 150, 243, 0.25);
        }

        .badge-missed {
            background: rgba(244, 67, 54, 0.12);
            color: #ff8a80;
            border: 1px solid rgba(244, 67, 54, 0.25);
        }

        .badge-rejected {
            background: rgba(255, 152, 0, 0.12);
            color: #ffcc80;
            border: 1px solid rgba(255, 152, 0, 0.25);
        }

        .badge-unknown {
            background: rgba(158, 158, 158, 0.12);
            color: #bdbdbd;
            border: 1px solid rgba(158, 158, 158, 0.25);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #444;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .stats-grid, .today-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 750px) {
            .stats-grid, .today-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 16px; }
        }

        @media (max-width: 480px) {
            .stats-grid, .today-grid { grid-template-columns: 1fr; }
            .header { padding: 16px; }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📞 Cally<span>zer</span></h1>
    <div class="connection-status">
        <div class="dot" id="wsDot"></div>
        <span id="wsStatus">Connecting...</span>
    </div>
</div>

<div class="container">

    <!-- All-Time Stats -->
    <div class="section-title">📊 All-Time Overview</div>
    <div class="stats-grid">
        <div class="stat-card total">
            <div class="stat-icon">📊</div>
            <div class="stat-label">Total Calls</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card incoming">
            <div class="stat-icon">📥</div>
            <div class="stat-label">Incoming</div>
            <div class="stat-value" id="statIncoming">0</div>
        </div>
        <div class="stat-card outgoing">
            <div class="stat-icon">📤</div>
            <div class="stat-label">Outgoing</div>
            <div class="stat-value" id="statOutgoing">0</div>
        </div>
        <div class="stat-card missed">
            <div class="stat-icon">📵</div>
            <div class="stat-label">Missed</div>
            <div class="stat-value" id="statMissed">0</div>
        </div>
        <div class="stat-card talktime">
            <div class="stat-icon">⏱️</div>
            <div class="stat-label">Total Talk Time</div>
            <div class="stat-value" id="statTotalTalkTime">0m</div>
        </div>
    </div>

    <!-- Today Stats -->
    <div class="section-title">📅 Today's Activity</div>
    <div class="today-grid">
        <div class="today-card">
            <div class="today-label">Calls Today</div>
            <div class="today-value" id="todayTotal">0</div>
        </div>
        <div class="today-card">
            <div class="today-label">Incoming</div>
            <div class="today-value" id="todayIncoming">0</div>
        </div>
        <div class="today-card">
            <div class="today-label">Outgoing</div>
            <div class="today-value" id="todayOutgoing">0</div>
        </div>
        <div class="today-card">
            <div class="today-label">Missed</div>
            <div class="today-value" id="todayMissed">0</div>
        </div>
        <div class="today-card today-talktime">
            <div class="today-label">Talk Time Today</div>
            <div class="today-value" id="todayTalkTime">0m</div>
        </div>
    </div>

    <!-- Call Log Table -->
    <div class="table-section">
        <div class="table-header">
            <h2>📋 Call Feed</h2>
            <div class="live-badge">
                <div class="pulse"></div>
                LIVE
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Contact</th>
                        <th>Number</th>
                        <th>Type</th>
                        <th>Duration</th>
                        <th>Device</th>
                    </tr>
                </thead>
                <tbody id="callTableBody">
                    <tr class="empty-state" id="emptyRow">
                        <td colspan="6">
                            <div class="icon">📱</div>
                            <p>Waiting for call events...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- SockJS & STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    // === Utility Functions ===

    function formatDuration(seconds) {
        if (seconds == null || seconds === 0) return '<span class="duration-zero">—</span>';
        var hrs = Math.floor(seconds / 3600);
        var mins = Math.floor((seconds % 3600) / 60);
        var secs = seconds % 60;
        if (hrs > 0) {
            return '<span class="duration-cell">' + hrs + 'h ' + mins + 'm ' + secs + 's</span>';
        }
        if (mins > 0) {
            return '<span class="duration-cell">' + mins + 'm ' + secs + 's</span>';
        }
        return '<span class="duration-cell">' + secs + 's</span>';
    }

    function formatTalkTime(totalSeconds) {
        if (!totalSeconds || totalSeconds === 0) return '0m';
        var hrs = Math.floor(totalSeconds / 3600);
        var mins = Math.floor((totalSeconds % 3600) / 60);
        var secs = totalSeconds % 60;
        if (hrs > 0) {
            return hrs + 'h ' + mins + 'm';
        }
        if (mins > 0) {
            return mins + 'm ' + secs + 's';
        }
        return secs + 's';
    }

    function formatTimestamp(epochMs) {
        if (!epochMs) return '—';
        var d = new Date(epochMs);
        var now = new Date();
        var pad = function(n) { return String(n).padStart(2, '0'); };

        var time = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());

        // If today, show only time
        if (d.toDateString() === now.toDateString()) {
            return 'Today ' + time;
        }
        // If yesterday
        var yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) {
            return 'Yesterday ' + time;
        }
        // Otherwise show date + time
        return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + time;
    }

    function getBadgeClass(callType) {
        switch (callType) {
            case 'INCOMING': return 'badge-incoming';
            case 'OUTGOING': return 'badge-outgoing';
            case 'MISSED':   return 'badge-missed';
            case 'REJECTED': return 'badge-rejected';
            default:         return 'badge-unknown';
        }
    }

    function createCallRow(call, isNew) {
        var tr = document.createElement('tr');
        if (isNew) tr.classList.add('new-row');

        tr.innerHTML =
            '<td>' + formatTimestamp(call.callTimestamp) + '</td>' +
            '<td><span class="contact-name">' + (call.contactName || '—') + '</span></td>' +
            '<td><span class="phone-number">' + (call.phoneNumber || '—') + '</span></td>' +
            '<td><span class="badge ' + getBadgeClass(call.callType) + '">' + (call.callType || 'UNKNOWN') + '</span></td>' +
            '<td>' + formatDuration(call.duration) + '</td>' +
            '<td><span class="device-id">' + (call.deviceId || '—') + '</span></td>';

        if (isNew) {
            setTimeout(function() { tr.classList.remove('new-row'); }, 3000);
        }
        return tr;
    }

    // === Load Initial Data ===

    function loadInitialData() {
        fetch('/api/v1/calls?size=200')
            .then(function(res) { return res.json(); })
            .then(function(calls) {
                var tbody = document.getElementById('callTableBody');
                var emptyRow = document.getElementById('emptyRow');
                if (calls.length > 0 && emptyRow) {
                    emptyRow.remove();
                }
                calls.forEach(function(call) {
                    tbody.appendChild(createCallRow(call, false));
                });
            })
            .catch(function(err) { console.error('Failed to load calls:', err); });

        refreshStats();
    }

    function refreshStats() {
        fetch('/api/v1/calls/stats')
            .then(function(res) { return res.json(); })
            .then(function(stats) {
                // All-time stats
                document.getElementById('statTotal').textContent = stats.totalCalls || 0;
                document.getElementById('statIncoming').textContent = stats.incomingCalls || 0;
                document.getElementById('statOutgoing').textContent = stats.outgoingCalls || 0;
                document.getElementById('statMissed').textContent = stats.missedCalls || 0;
                document.getElementById('statTotalTalkTime').textContent = formatTalkTime(stats.totalTalkTimeSeconds || 0);

                // Today stats
                document.getElementById('todayTotal').textContent = stats.todayTotalCalls || 0;
                document.getElementById('todayIncoming').textContent = stats.todayIncomingCalls || 0;
                document.getElementById('todayOutgoing').textContent = stats.todayOutgoingCalls || 0;
                document.getElementById('todayMissed').textContent = stats.todayMissedCalls || 0;
                document.getElementById('todayTalkTime').textContent = formatTalkTime(stats.todayTalkTimeSeconds || 0);
            })
            .catch(function(err) { console.error('Failed to load stats:', err); });
    }

    // === WebSocket Connection ===

    function connectWebSocket() {
        var socket = new SockJS('/ws');
        var stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function(frame) {
            document.getElementById('wsDot').classList.add('connected');
            document.getElementById('wsStatus').textContent = 'Connected';

            // Subscribe to live call events
            stompClient.subscribe('/topic/calls', function(message) {
                var call = JSON.parse(message.body);
                var tbody = document.getElementById('callTableBody');
                var emptyRow = document.getElementById('emptyRow');
                if (emptyRow) emptyRow.remove();

                var row = createCallRow(call, true);
                tbody.insertBefore(row, tbody.firstChild);

                // Refresh all stats for accuracy
                refreshStats();
            });

            // Subscribe to batch refresh events
            stompClient.subscribe('/topic/refresh', function(message) {
                refreshStats();
                var tbody = document.getElementById('callTableBody');
                tbody.innerHTML = '';
                fetch('/api/v1/calls?size=200')
                    .then(function(res) { return res.json(); })
                    .then(function(calls) {
                        calls.forEach(function(call) {
                            tbody.appendChild(createCallRow(call, false));
                        });
                    });
            });

        }, function(error) {
            document.getElementById('wsDot').classList.remove('connected');
            document.getElementById('wsStatus').textContent = 'Disconnected — retrying...';
            setTimeout(connectWebSocket, 5000);
        });
    }

    // === Init ===
    document.addEventListener('DOMContentLoaded', function() {
        loadInitialData();
        connectWebSocket();
    });
</script>

</body>
</html>
