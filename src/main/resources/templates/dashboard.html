<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callyzer — Live Call Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f0e17;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 24px 32px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            color: #4CAF50;
        }

        .header .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #888;
        }

        .header .connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #F44336;
            transition: background 0.3s ease;
        }

        .header .connection-status .dot.connected {
            background: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 32px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #1a1a2e;
            border-radius: 14px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .stat-card .stat-label {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
        }

        .stat-card .stat-icon {
            float: right;
            font-size: 28px;
            opacity: 0.6;
        }

        .stat-card.total .stat-value { color: #e0e0e0; }
        .stat-card.incoming .stat-value { color: #4CAF50; }
        .stat-card.outgoing .stat-value { color: #2196F3; }
        .stat-card.missed .stat-value { color: #F44336; }

        /* Table Section */
        .table-section {
            background: #1a1a2e;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .table-header .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .table-header .live-badge .pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(76, 175, 80, 0); }
            100% { opacity: 1; box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            padding: 14px 20px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.02);
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        tbody tr.new-row {
            animation: fadeIn 0.5s ease;
            background: rgba(76, 175, 80, 0.06);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        tbody td {
            padding: 14px 20px;
            font-size: 14px;
            color: #ccc;
        }

        .phone-number, .device-id {
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #aaa;
        }

        .contact-name {
            color: #e0e0e0;
            font-weight: 500;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-incoming {
            background: rgba(76, 175, 80, 0.15);
            color: #4CAF50;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .badge-outgoing {
            background: rgba(33, 150, 243, 0.15);
            color: #2196F3;
            border: 1px solid rgba(33, 150, 243, 0.3);
        }

        .badge-missed {
            background: rgba(244, 67, 54, 0.15);
            color: #F44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .badge-rejected {
            background: rgba(255, 152, 0, 0.15);
            color: #FF9800;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .badge-unknown {
            background: rgba(158, 158, 158, 0.15);
            color: #9E9E9E;
            border: 1px solid rgba(158, 158, 158, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 15px;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .container { padding: 16px; }
        }

        @media (max-width: 500px) {
            .stats-grid { grid-template-columns: 1fr; }
            .header { padding: 16px; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📞 Cally<span>zer</span></h1>
    <div class="connection-status">
        <div class="dot" id="wsDot"></div>
        <span id="wsStatus">Connecting...</span>
    </div>
</div>

<div class="container">
    <!-- Stats Cards -->
    <div class="stats-grid">
        <div class="stat-card total">
            <div class="stat-icon">📊</div>
            <div class="stat-label">Total Calls</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card incoming">
            <div class="stat-icon">📥</div>
            <div class="stat-label">Incoming</div>
            <div class="stat-value" id="statIncoming">0</div>
        </div>
        <div class="stat-card outgoing">
            <div class="stat-icon">📤</div>
            <div class="stat-label">Outgoing</div>
            <div class="stat-value" id="statOutgoing">0</div>
        </div>
        <div class="stat-card missed">
            <div class="stat-icon">📵</div>
            <div class="stat-label">Missed</div>
            <div class="stat-value" id="statMissed">0</div>
        </div>
    </div>

    <!-- Call Log Table -->
    <div class="table-section">
        <div class="table-header">
            <h2>📋 Call Feed</h2>
            <div class="live-badge">
                <div class="pulse"></div>
                LIVE
            </div>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Device ID</th>
                        <th>Number</th>
                        <th>Contact</th>
                        <th>Type</th>
                        <th>Duration</th>
                    </tr>
                </thead>
                <tbody id="callTableBody">
                    <tr class="empty-state" id="emptyRow">
                        <td colspan="6">
                            <div class="icon">📱</div>
                            <p>Waiting for call events...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- SockJS & STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    // === Utility Functions ===

    function formatDuration(seconds) {
        if (seconds == null || seconds === 0) return '0s';
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        if (mins === 0) return secs + 's';
        return mins + 'm ' + secs + 's';
    }

    function formatTimestamp(epochMs) {
        if (!epochMs) return '—';
        const d = new Date(epochMs);
        const pad = n => String(n).padStart(2, '0');
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
               ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function getBadgeClass(callType) {
        switch (callType) {
            case 'INCOMING': return 'badge-incoming';
            case 'OUTGOING': return 'badge-outgoing';
            case 'MISSED':   return 'badge-missed';
            case 'REJECTED': return 'badge-rejected';
            default:         return 'badge-unknown';
        }
    }

    function createCallRow(call, isNew) {
        const tr = document.createElement('tr');
        if (isNew) tr.classList.add('new-row');

        tr.innerHTML =
            '<td>' + formatTimestamp(call.callTimestamp) + '</td>' +
            '<td><span class="device-id">' + (call.deviceId || '—') + '</span></td>' +
            '<td><span class="phone-number">' + (call.phoneNumber || '—') + '</span></td>' +
            '<td><span class="contact-name">' + (call.contactName || '—') + '</span></td>' +
            '<td><span class="badge ' + getBadgeClass(call.callType) + '">' + (call.callType || 'UNKNOWN') + '</span></td>' +
            '<td>' + formatDuration(call.duration) + '</td>';

        // Remove the new-row animation after it plays
        if (isNew) {
            setTimeout(function() { tr.classList.remove('new-row'); }, 2000);
        }
        return tr;
    }

    // === Load Initial Data ===

    function loadInitialData() {
        fetch('/api/v1/calls?size=100')
            .then(function(res) { return res.json(); })
            .then(function(calls) {
                var tbody = document.getElementById('callTableBody');
                var emptyRow = document.getElementById('emptyRow');
                if (calls.length > 0 && emptyRow) {
                    emptyRow.remove();
                }
                calls.forEach(function(call) {
                    tbody.appendChild(createCallRow(call, false));
                });
            })
            .catch(function(err) { console.error('Failed to load calls:', err); });

        fetch('/api/v1/calls/stats')
            .then(function(res) { return res.json(); })
            .then(function(stats) {
                document.getElementById('statTotal').textContent = stats.totalCalls || 0;
                document.getElementById('statIncoming').textContent = stats.incomingCalls || 0;
                document.getElementById('statOutgoing').textContent = stats.outgoingCalls || 0;
                document.getElementById('statMissed').textContent = stats.missedCalls || 0;
            })
            .catch(function(err) { console.error('Failed to load stats:', err); });
    }

    function refreshStats() {
        fetch('/api/v1/calls/stats')
            .then(function(res) { return res.json(); })
            .then(function(stats) {
                document.getElementById('statTotal').textContent = stats.totalCalls || 0;
                document.getElementById('statIncoming').textContent = stats.incomingCalls || 0;
                document.getElementById('statOutgoing').textContent = stats.outgoingCalls || 0;
                document.getElementById('statMissed').textContent = stats.missedCalls || 0;
            })
            .catch(function(err) { console.error('Failed to refresh stats:', err); });
    }

    // === WebSocket Connection ===

    function connectWebSocket() {
        var socket = new SockJS('/ws');
        var stompClient = Stomp.over(socket);
        stompClient.debug = null; // suppress debug logs

        stompClient.connect({}, function(frame) {
            // Connected
            document.getElementById('wsDot').classList.add('connected');
            document.getElementById('wsStatus').textContent = 'Connected';

            // Subscribe to live call events
            stompClient.subscribe('/topic/calls', function(message) {
                var call = JSON.parse(message.body);
                var tbody = document.getElementById('callTableBody');
                var emptyRow = document.getElementById('emptyRow');
                if (emptyRow) emptyRow.remove();

                var row = createCallRow(call, true);
                tbody.insertBefore(row, tbody.firstChild);

                // Update stats locally for instant feedback
                var totalEl = document.getElementById('statTotal');
                totalEl.textContent = parseInt(totalEl.textContent) + 1;

                if (call.callType === 'INCOMING') {
                    var el = document.getElementById('statIncoming');
                    el.textContent = parseInt(el.textContent) + 1;
                } else if (call.callType === 'OUTGOING') {
                    var el = document.getElementById('statOutgoing');
                    el.textContent = parseInt(el.textContent) + 1;
                } else if (call.callType === 'MISSED') {
                    var el = document.getElementById('statMissed');
                    el.textContent = parseInt(el.textContent) + 1;
                }
            });

            // Subscribe to batch refresh events
            stompClient.subscribe('/topic/refresh', function(message) {
                refreshStats();
                // Reload the full table
                var tbody = document.getElementById('callTableBody');
                tbody.innerHTML = '';
                fetch('/api/v1/calls?size=100')
                    .then(function(res) { return res.json(); })
                    .then(function(calls) {
                        calls.forEach(function(call) {
                            tbody.appendChild(createCallRow(call, false));
                        });
                    });
            });

        }, function(error) {
            // Connection failed / lost
            document.getElementById('wsDot').classList.remove('connected');
            document.getElementById('wsStatus').textContent = 'Disconnected — retrying...';
            setTimeout(connectWebSocket, 5000);
        });
    }

    // === Init ===
    document.addEventListener('DOMContentLoaded', function() {
        loadInitialData();
        connectWebSocket();
    });
</script>

</body>
</html>
